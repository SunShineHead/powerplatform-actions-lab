name: release-solution-to-prod
# Prepare a managed Power Platform solution for production deployment.
# Authentication remains secret-based here; migrate to workload identity/OIDC
# after the target Power Platform authentication configuration is verified.

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  convert-to-managed:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pack solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions/ALMLab
          solution-file: out/solutions/ALMLab.zip
          solution-type: Unmanaged

      - name: Import solution as unmanaged to build env
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://user9-build.crm.dynamics.com/'
          user-name: 'user9@wrkdevops.onmicrosoft.com'
          password-secret: ${{ secrets.password }}
          solution-file: out/solutions/ALMLab.zip
          force-overwrite: true
          publish-changes: true

      - name: Export solution as managed
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: 'https://user9-build.crm.dynamics.com/'
          user-name: 'user9@wrkdevops.onmicrosoft.com'
          password-secret: ${{ secrets.password }}
          solution-name: ALMLab
          managed: true
          solution-output-file: out/ship/ALMLab.zip

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: managedSolutions
          path: out/ship/ALMLab.zip
          if-no-files-found: error

  release-to-prod:
    needs: [convert-to-managed]
    runs-on: windows-latest
    environment:
      name: production

    steps:
      - name: Download managed solution artifact
        uses: actions/download-artifact@v4
        with:
          name: managedSolutions
          path: out/release/

      - name: Import solution to production
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: 'https://user9-prod.crm.dynamics.com/'
          user-name: 'user9@wrkdevops.onmicrosoft.com'
          password-secret: ${{ secrets.password }}
          solution-file: out/release/ALMLab.zip
          force-overwrite: true
          publish-changes: true
